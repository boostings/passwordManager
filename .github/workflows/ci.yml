name: ci
# Manual only: run from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin by SHA; SR-600)
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (extension tests need Node 20+; M5.3)
        with: { node-version: '22' }
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install scanners
        shell: bash
        run: |
          pip install --quiet semgrep==1.176.0
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          elif [[ "$RUNNER_OS" == "macOS" ]]; then brew install gitleaks
          else choco install gitleaks -y --no-progress; fi
      - name: Secret scan (SR-800)
        shell: bash
        run: gitleaks git --redact --no-banner --config tools/cert-rules/gitleaks.toml .
      - name: Build, tests, static analysis, CERT report
        # --continue: one run reports every module's failures, not only the first module's.
        run: ./gradlew --no-daemon --console=plain --continue check certReport
      - name: env run writes nothing to disk, under strace (plan.md §13 M2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq strace
          tools/ci/env-run-trace.sh build/env-run-trace
      - name: Canary secret must not appear in any output (SR-500)
        shell: bash
        run: |
          if grep -rIl "CANARY-7f3a9c2e-DO-NOT-LOG" --include='*.xml' --include='*.txt' --include='*.log' --include='*.html' modules/*/build 2>/dev/null; then
            echo "::error::canary secret leaked into build output"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/cert-compliance.md
            build/reports/semgrep-cert.json
            modules/*/build/reports/**

  dependency-scan:
    name: dependency vulnerabilities (SR-600)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: { distribution: temurin, java-version: '21' }
      - name: Dependency verification metadata must be present and strict
        run: test -f gradle/verification-metadata.xml && grep -q '<verify-metadata>true</verify-metadata>' gradle/verification-metadata.xml
      - name: OWASP Dependency-Check (not wired in v1)
        run: echo "::warning::No dependency vulnerability scan ran. OWASP Dependency-Check needs an NVD API key that has not been provisioned (README, Status and known limitations)."
